
<!DOCTYPE html>
<html>
<head>

<title>DENIS MEETING</title>
<script src='https://meet.jit.si/external_api.js'></script>
<style>
body{margin:0;background:#000}
#meet{width:100vw;height:100vh}
</style>
</head>
<body>
<div id="meet"></div>
<script>
const domain="meet.jit.si";
const options={
roomName:"DenisOfficial",
width:"100%",
height:"100%",
parentNode:document.querySelector('#meet'),
configOverwrite:{startWithAudioMuted:false,startWithVideoMuted:false},
interfaceConfigOverwrite:{TOOLBAR_BUTTONS:['microphone','camera','desktop','fullscreen','hangup','recording','chat','settings']},
userInfo:{displayName:"Denis"}
};
const api=new JitsiMeetExternalAPI(domain,options);
</script>
